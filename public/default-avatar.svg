  <line x1="38" y1="28" x2="30" y2="18" stroke="#2c2e2a" stroke-width="3" stroke-linecap="round" />
  <line x1="62" y1="28" x2="70" y2="18" stroke="#2c2e2a" stroke-width="3" stroke-linecap="round" />
