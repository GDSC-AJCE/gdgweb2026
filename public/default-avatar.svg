  <!-- Google Color Accents -->
  <path d="M 45 74 L 50 78 L 45 82" stroke="#4285F4" stroke-width="2" stroke-linecap="round" />
  <path d="M 55 74 L 50 78 L 55 82" stroke="#EA4335" stroke-width="2" stroke-linecap="round" />
