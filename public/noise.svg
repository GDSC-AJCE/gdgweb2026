<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <filter id="noise">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.6"
      numOctaves="1"
      stitchTiles="stitch"
    />
  </filter>

  <rect
    width="100%"
    height="100%"
    filter="url(#noise)"
    opacity="0.4"
  />
</svg>
